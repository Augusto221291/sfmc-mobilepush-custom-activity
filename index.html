<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MobilePush Legado</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/postmonger.js"></script>
    <script src="customActivity.js"></script>

    <style>
        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #181818;
        }

        .container {
            max-width: 520px;
        }

        h2 {
            margin: 0 0 6px;
            font-size: 20px;
        }

        .description {
            margin: 0 0 24px;
            font-size: 13px;
            line-height: 1.4;
            color: #5f6368;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            height: 40px;
            box-sizing: border-box;
            padding: 8px 10px;
            border: 1px solid #c9c9c9;
            border-radius: 4px;
            background: #ffffff;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #0176d3;
            box-shadow: 0 0 0 1px #0176d3;
        }

        .help {
            margin-top: 7px;
            font-size: 12px;
            line-height: 1.4;
            color: #666666;
        }

        .example {
            margin-top: 7px;
            font-size: 12px;
            color: #444444;
        }

        .error {
            display: none;
            margin-top: 7px;
            font-size: 12px;
            color: #ba0517;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>MobilePush Legado</h2>

    <p class="description">
        Configure a mensagem MobilePush que será disparada quando o contato chegar nesta atividade.
    </p>

    <div class="field">
        <label for="appName">Aplicativo</label>

        <select id="appName">
            <option value="">Selecione...</option>
            <option value="zap">ZAP Imóveis</option>
            <option value="vivareal">Viva Real</option>
        </select>

        <div id="appError" class="error">
            Selecione um aplicativo.
        </div>
    </div>

    <div class="field">

        <label for="messageId">Message ID</label>

        <input
            id="messageId"
            type="text"
            placeholder="Informe o Message ID"
            maxlength="255"
        >

        <div class="help">
            Informe o Message ID da API Triggered Message configurada para o aplicativo selecionado.
        </div>

        <div id="messageExample" class="example"></div>

        <div id="messageIdError" class="error">
            Informe um Message ID.
        </div>

    </div>

</div>

</body>
</html>
