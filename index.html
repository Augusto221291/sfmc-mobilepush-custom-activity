<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MobilePush Legado</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/postmonger.js"></script>
    <script src="customActivity.js"></script>

    <style>
        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #181818;
        }

        .container {
            max-width: 520px;
        }

        h2 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .description {
            margin: 0 0 24px;
            color: #5f6368;
            font-size: 13px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 40px;
            box-sizing: border-box;
            padding: 8px 10px;
            border: 1px solid #c9c9c9;
            border-radius: 4px;
            background: #ffffff;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #0176d3;
            box-shadow: 0 0 0 1px #0176d3;
        }

        .help {
            margin-top: 8px;
            color: #666666;
            font-size: 12px;
            line-height: 1.4;
        }

        .error {
            display: none;
            margin-top: 8px;
            color: #ba0517;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>MobilePush Legado</h2>

    <p class="description">
        Configure a mensagem MobilePush que será disparada quando o contato chegar nesta atividade.
    </p>

    <label for="messageId">
        Message ID
    </label>

    <input
        id="messageId"
        type="text"
        placeholder="Informe o Message ID"
        maxlength="255"
    >

    <div class="help">
        Informe o Message ID da API Triggered Message configurada na BU legado.
    </div>

    <div id="messageIdError" class="error">
        Informe um Message ID antes de continuar.
    </div>

</div>

</body>
</html>
